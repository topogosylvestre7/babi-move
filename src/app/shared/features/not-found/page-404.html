<div class="error-page error-404">
  <div class="error-content">
    <!-- Illustration -->
    <div class="error-illustration">
      <div class="error-code" role="img" aria-label="Erreur 404">
        <span class="digit">4</span>
        <span class="digit zero">
          <i class="bi bi-search" aria-hidden="true"></i>
        </span>
        <span class="digit">4</span>
      </div>
      <div class="floating-elements" aria-hidden="true">
        <i class="bi bi-file-earmark floating-icon icon-1"></i>
        <i class="bi bi-folder floating-icon icon-2"></i>
        <i class="bi bi-question-circle floating-icon icon-3"></i>
      </div>
    </div>

    <!-- Message -->
    <div class="error-message">
      <h1>Page introuvable</h1>
      <p>
        Oups ! Cette page s'est perdue en route, comme un gbaka sans destination. Elle a peut-être
        été déplacée ou supprimée.
      </p>
    </div>

    <!-- Recherche : la saisie devient la destination de la page des résultats -->
    <div class="error-search">
      <div class="search-box">
        <i class="bi bi-search" aria-hidden="true"></i>
        <input
          #destination
          type="text"
          aria-label="Destination"
          placeholder="Où veux-tu aller ?"
          (keyup.enter)="onSearch(destination.value)"
        />
        <button
          type="button"
          class="search-btn"
          aria-label="Rechercher cette destination"
          (click)="onSearch(destination.value)"
        >
          <i class="bi bi-arrow-right" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div class="error-actions">
      <button type="button" class="ui-btn ui-btn--primary" (click)="goHome()">
        <i class="bi bi-house" aria-hidden="true"></i>
        Retour à l'accueil
      </button>
      <button type="button" class="ui-btn ui-btn--outline" (click)="goBack()">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
        Page précédente
      </button>
    </div>

    <!-- Liens utiles -->
    <div class="popular-links">
      <p class="links-title">Liens utiles :</p>
      <div class="links-list">
        @for (link of usefulLinks; track link.path) {
          <a [routerLink]="link.path" class="link-item">
            <i class="bi" [class]="link.icon" aria-hidden="true"></i>
            {{ link.label }}
          </a>
        }
      </div>
    </div>
  </div>
</div>
